# dev profile
# Activated by: --spring.profiles.active=dev
# logback-spring.xml automatically applies the <springProfile name="dev"> block
# which enables:
#   - Hibernate SQL logging logs/skillsync-sql.log
#   - Spring Security DEBUG  logs/skillsync-security.log
#   - Full DEBUG for com.skillsync  logs/skillsync-debug.log

# Fresh schema on every restart in dev (switch to 'update' to keep data)
spring.jpa.hibernate.ddl-auto=update

# Show SQL in console during dev (logback-spring.xml also writes to file)
spring.jpa.show-sql=true
