# Server
server.port=8080
spring.application.name=SkillSync

#Database
spring.datasource.url=jdbc:mysql://localhost:3306/skillsync_db
spring.datasource.username=root
# Store the actual password in an environment variable never hardcode it.
# Set DB_Password in your OS environment or in a .env file (not committed to git).
spring.datasource.password=${DB_Password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#  Connection Pool (HikariCP) 
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

#  JPA / Hibernate 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

#  Jackson 
spring.jackson.date-format=dd-MM-yyyy HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.default-property-inclusion=non_null

#  JWT 
jwt.secret=Superskillsync_secret_key_93513600000000000000000000000000
jwt.expiration=900000

#  Logging 
# Logging is fully controlled by logback-spring.xml
# Do NOT add logging.level.* here  it conflicts with logback-spring.xml.
# To change log levels use the <springProfile> blocks inside logback-spring.xml.
logging.config=classpath:logback-spring.xml
